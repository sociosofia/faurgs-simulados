name: Validar simulador
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/app.js
      - run: node --check js/richtext.js
      - run: node scripts/test-richtext.cjs
      - run: node scripts/validate-bank.mjs
      - run: node scripts/audit-formatting.mjs
